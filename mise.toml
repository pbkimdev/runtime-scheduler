[tools]
uv = "latest"
node = "24"
gitleaks = "8.30.1"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"

[tasks.dev]
description = "Install the Python environment"
run = "uv sync"

[tasks.test]
description = "Run pytest"
run = "uv run pytest -q"

[tasks.lint]
description = "ruff check and format check"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.fmt]
description = "Format with ruff and apply its fixes"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks.build]
description = "Build the package"
run = "uv build"

[tasks.verify]
description = "The whole gate, via ./scripts/verify"
run = "./scripts/verify"

[tasks.allocate-dry]
description = "Allocator dry run against the repository's own ledger"
run = "uv run scheduler allocate --dry-run"

[tasks.contract]
description = "Check the fallback chain's premise"
run = "uv run scheduler contract-check"
