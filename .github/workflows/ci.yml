name: ci

# The scheduler repository does not call its own reusable workflows. It is the
# thing that publishes the routes; routing it through them would make a broken
# route able to break its own repair.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # astral-sh/setup-uv v10.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      # jdx/mise-action v4.3.0. mise.toml pins the gate's non-Python tools.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      - run: make verify
